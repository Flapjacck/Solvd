<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/soldv_icon.png" />
    <link rel="apple-touch-icon" href="/soldv_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Solvd</title>
    <!-- Apply the saved theme before first paint so dark mode doesn't flash white.
         Same rule as lib/theme.ts. -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('solvd.settings') || '{}').theme) || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!-- Google Fonts: Outfit (UI, variable 400-700) and Orbitron 700 (timer only).
         preconnect cuts the DNS/TLS round trips; display=swap shows fallback text right away. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
