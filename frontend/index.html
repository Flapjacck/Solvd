<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/soldv_icon.png" />
    <link rel="apple-touch-icon" href="/soldv_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Solvd: speedcubing timer with scrambles, sessions and stats</title>
    <meta name="description" content="Solvd is a free speedcubing timer with scrambles for every WCA event, sessions, stats and graphs. Your solves save in your browser, with import and export." />
    <meta name="application-name" content="Solvd" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://solvd.spencerkelly.ca/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solvd" />
    <meta property="og:title" content="Solvd: speedcubing timer" />
    <meta property="og:description" content="A speedcubing timer with scrambles for every WCA event, sessions, stats and graphs. Free, and your solves stay in your browser." />
    <meta property="og:url" content="https://solvd.spencerkelly.ca/" />
    <meta property="og:image" content="https://solvd.spencerkelly.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Solvd, with a Rubik's cube as the d" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solvd: speedcubing timer" />
    <meta name="twitter:description" content="A speedcubing timer with scrambles for every WCA event, sessions, stats and graphs." />
    <meta name="twitter:image" content="https://solvd.spencerkelly.ca/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Solvd",
        "url": "https://solvd.spencerkelly.ca/",
        "description": "Solvd is a free speedcubing timer with scrambles for every WCA event, sessions, stats and graphs. Your solves save in your browser, with import and export.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Spencer Kelly",
          "url": "https://github.com/Flapjacck"
        },
        "sameAs": [
          "https://github.com/Flapjacck/Solvd"
        ]
      }
    </script>
    <!-- Apply the saved theme before first paint so dark mode doesn't flash white.
         Same rule as lib/theme.ts. -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('solvd.settings') || '{}').theme) || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!-- Google Fonts: Outfit (UI, variable 400-700) and Orbitron 700 (timer only).
         preconnect cuts the DNS/TLS round trips; display=swap shows fallback text right away. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Solvd</h1>
      <p>Solvd is a speedcubing timer with scrambles for every WCA event, sessions, stats and graphs. It needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
